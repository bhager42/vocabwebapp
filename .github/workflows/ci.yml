# Checks every push and pull request, and publishes the container image when a version
# tag (v1.2.3) is pushed.
#
# Actions are pinned to a commit, with the version in a comment, so that a moved tag can
# never change what runs here.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # .npmrc sets ignore-scripts, so no package can run code during install.
      - run: npm ci

      - name: Format and lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Check the word lists
        run: npm run content:check

      - name: Unit tests
        run: npx vitest --run

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results
          retention-days: 7

  image:
    name: Build and scan the image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: vocabwebapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it the way TrueNAS will and wait for it to be healthy
        run: |
          docker run -d --name vocab --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --user 568:568 \
            -e ORIGIN=http://localhost:3000 -e SETUP_TOKEN=ci -p 3000:3000 \
            vocabwebapp:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs vocab
          exit 1

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      # Fails on any high or critical finding, in the system packages or in npm packages.
      - name: Scan for known vulnerabilities
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 vocabwebapp:ci

      - name: List everything in the image (SBOM)
        run: trivy image --format cyclonedx --output sbom.cdx.json vocabwebapp:ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  publish:
    name: Publish the image
    # Only for a version tag, and only after the tests and the scan have passed.
    if: github.ref_type == 'tag'
    needs: [test, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 is published as 1.2.3 and 1.2.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
